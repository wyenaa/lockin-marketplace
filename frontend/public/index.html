function escapeUi(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
function disputeFormValidation(form){
  form=form||{};
  var title=String(form.title||'').trim(),evidence=String(form.evidence||'').trim(),url=String(form.evidenceUrl||'').trim(),errors={};
  var reason=title;
  if(!title)errors.title='Judul keluhan wajib diisi.';
  if(!evidence||evidence.length<5)errors.evidence='Bukti tertulis wajib diisi minimal 5 karakter.';
  else if(evidence.length>4000)errors.evidence='Bukti tertulis maksimal 4.000 karakter.';
  if(title&&reason.length>1000)errors.title='Kategori dan kronologi harus maksimal 1.000 karakter.';
  if(url){try{var parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol)||!parsed.hostname)throw new Error('invalid')}catch(_){errors.evidenceUrl='Masukkan tautan http:// atau https:// yang valid.'}}
  return {valid:Object.keys(errors).length===0,errors:errors,reason:reason,evidence:evidence,evidenceUrl:url};
}

function safeVendorApplicationUrl(value){
  if(typeof value!=='string'||!value.trim())return '';
  try{var url=new URL(value.trim());return ['http:','https:'].includes(url.protocol)&&url.hostname?url.href:''}catch(e){return ''}
}
function vendorApplicationDate(value){
  if(!value)return '—';
  var date=new Date(value);
  return Number.isNaN(date.getTime())?escapeUi(value):escapeUi(date.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}));
}
function vendorApplicationStatusLabel(value){
  return value==='pending_approval'?'Menunggu Persetujuan':String(value||'—').replace(/_/g,' ');
}
function vendorApplicationBasePrice(value){
  var amount=Number(value);
  return value==null||value===''||!Number.isFinite(amount)||amount<=0?'Belum diisi':'Rp'+amount.toLocaleString('id-ID',{minimumFractionDigits:Number.isInteger(amount)?0:2,maximumFractionDigits:2});

function vendorApplicationUrlValue(value,linkLabel){

function openDisputeModal(bookingId){
  if(S.role!=='customer'||S.disputeModalLoading)return;
  var booking=(S.bookingsList||[]).find(function(item){return String(item.id)===String(bookingId)});
  if(!booking){toast('Booking tidak ditemukan.');return;}
  if(!['DPPaid','Paid'].includes(booking.state)||booking.dispute||booking.disputed){toast('Sengketa tidak dapat diajukan untuk status booking ini.');return;}
  S.disputePreviousFocus=document.activeElement;S.disputeModalBookingId=String(booking.id);
  S.disputeForm={title:'',evidence:'',evidenceUrl:''};S.disputeErrors={};render();
  var title=document.getElementById('dispute-title');if(title)title.focus();
}

function restoreDisputeFocus(previous){
  if(previous&&document.contains(previous)){previous.focus();return;}
  var trigger=document.querySelector('[data-a="open-complain"]');if(trigger)trigger.focus();
}

function closeDisputeModal(){
  if(S.disputeModalLoading)return;
  var previous=S.disputePreviousFocus;S.disputeModalBookingId='';S.disputeForm={title:'',evidence:'',evidenceUrl:''};S.disputeErrors={};S.disputePreviousFocus=null;
  render();restoreDisputeFocus(previous);
}

async function submitBookingDispute(){
  if(S.role!=='customer'||S.disputeModalLoading||!S.disputeModalBookingId)return;
  var bookingId=S.disputeModalBookingId,checked=disputeFormValidation(S.disputeForm);
  S.disputeErrors=checked.errors;
  if(!checked.valid){render();var firstError=Object.keys(checked.errors)[0],field=document.getElementById('dispute-'+firstError);if(field)field.focus();return;}
  S.disputeModalLoading=true;S.disputeErrors={};render();
  try{
    var payload={reason:checked.reason,evidence:checked.evidence};if(checked.evidenceUrl)payload.evidenceUrl=checked.evidenceUrl;
    await apiRequest('/api/bookings/'+encodeURIComponent(bookingId)+'/dispute','POST',payload);
    var previous=S.disputePreviousFocus;S.disputeModalLoading=false;S.disputeModalBookingId='';S.disputeForm={title:'',evidence:'',evidenceUrl:''};S.disputeErrors={};S.disputePreviousFocus=null;render();
    try{await refreshBookings(bookingId);render();}catch(refreshError){toast('Sengketa berhasil dikirim. Status booking belum dapat diperbarui: '+refreshError.message);return;}
    toast('Sengketa berhasil diajukan untuk booking '+bookingId+'.');restoreDisputeFocus(previous);
  }catch(err){
    S.disputeModalLoading=false;S.disputeErrors={form:err.message||'Sengketa gagal dikirim. Periksa kembali data dan coba lagi.'};render();
    var submit=document.querySelector('#dispute-form button[type="submit"]');if(submit)submit.focus();
  }
}

async function apiRequest(path,method,body){
  var res=await fetch(path,{method:method||'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  var data=await res.json().catch(function(){return {}});
  if(!res.ok) throw new Error(data.error||'Permintaan gagal ('+res.status+').');
  return data;
}

async function submitAdminApplicationDecision(applicationId,status){

function normalizeBooking(b){
  var breakdown=b.paymentBreakdown||{},dpPaid=Number(breakdown.dpAmount)||0,finalPaid=Number(breakdown.finalAmount)||0;
  var finalDue=finalPaid>0?finalPaid:(dpPaid>0?Math.max(0,(Number(b.price)||0)-dpPaid):0);
  return Object.assign({},b,{date:b.event_date,dpPaid:dpPaid,finalPaid:finalPaid,rest:finalDue,arrived:!!b.vendor_arrived,otp:b.arrival_code||'',disputed:!!b.dispute});
}

  go('checkout');
  try{
    if(!bookingId) throw new Error('ID booking aktif tidak tersedia.');
    var booking=await apiRequest('/api/bookings/'+encodeURIComponent(bookingId));
    if(booking.id!==bookingId) throw new Error('Server mengembalikan booking yang berbeda.');
    if(booking.state!=='DPPaid') throw new Error('Booking tidak berstatus DP dibayar. Pelunasan tidak dapat dilanjutkan.');
    S.finalCheckoutBooking=booking;

}

async function refreshBookings(selectedId){
  var rows=await apiRequest('/api/bookings');
  S.bookingsList=rows.map(normalizeBooking);
  var selected=S.bookingsList.find(function(b){return b.id===(selectedId||S.activeBid)})||S.bookingsList[0];
  if(selected){
    try{selected=normalizeBooking(await apiRequest('/api/bookings/'+encodeURIComponent(selected.id)));S.bookingsList=S.bookingsList.map(function(b){return b.id===selected.id?selected:b});}
    catch(err){throw new Error('Booking termuat, tetapi detail/status gagal dibaca: '+err.message)}
    S.activeBid=selected.id;S.bookingId=selected.id;S.lunas=selected.paymentStatus==='PAID'||['Paid','Completed','Resolved'].indexOf(selected.state)>=0;
  }else{S.activeBid='';S.bookingId='';S.lunas=false;}
  S.backendError='';
  return S.bookingsList;
}

async function submitVendorArrival(bid){
  if(!bid || bid !== S.activeVendorBid) return;
  if(S.vendorVerifyLoading) return;

  var inputEl = document.getElementById('vendor-otp-input');
  var code = (inputEl ? inputEl.value : S.vendorOtpInput || '').trim();
  S.vendorOtpInput = code;
  S.vendorVerifyError = '';
  S.vendorVerifySuccess = '';

  if(!/^\d{6}$/.test(code)){
    S.vendorVerifyError = 'Kode OTP kedatangan harus berupa 6 digit angka.';
    render();
    return;
  }

  S.vendorVerifyLoading = true;
  render();

  try{
    var res = await apiRequest('/api/bookings/'+encodeURIComponent(bid)+'/verify-arrival', 'POST', { otp: code });
    if(S.activeVendorBid !== bid) return;

    S.vendorVerifySuccess = res.message || 'Kehadiran vendor berhasil diverifikasi.';
    S.vendorOtpInput = '';

    var updatedDetail = await apiRequest('/api/bookings/'+encodeURIComponent(bid));
    if(S.activeVendorBid === bid){
      S.vendorDetail = updatedDetail;
      var idx = (S.vendorBookings || []).findIndex(function(b){ return b.id === bid; });
      if(idx !== -1){
        S.vendorBookings[idx] = Object.assign({}, S.vendorBookings[idx], {
          vendor_arrived: updatedDetail.vendor_arrived,
          execution_state: updatedDetail.execution_state,
          executionStatus: updatedDetail.executionStatus,
          state: updatedDetail.state
        });
      }
    }
    toast('✅ Kehadiran berhasil diverifikasi!');
  }catch(err){
    if(S.activeVendorBid === bid){
      S.vendorVerifyError = err.message || 'Verifikasi kehadiran gagal.';
    }
  }finally{
    if(S.activeVendorBid === bid){
      S.vendorVerifyLoading = false;
      render();
    }
  }
}

function parseVendorBasePrice(value){
  var raw=String(value==null?'':value).trim();
  if(!/^\d+(?:\.\d{1,2})?$/.test(raw))return null;
  var amount=Number(raw);
  return Number.isFinite(amount)&&amount>0&&amount<=9999999999.99?amount:null;
}
function updateVendorBasePricePreview(){
  var input=document.getElementById('vbp'),preview=document.getElementById('vbp-preview'),raw=input.value.trim();
  if(!raw){preview.textContent='Masukkan nominal tanpa mengetik awalan Rp, contoh 250000.';return;}
  var amount=parseVendorBasePrice(raw);
  preview.textContent=amount!==null?'Format harga: '+vendorApplicationBasePrice(amount):'Harga harus lebih dari Rp0, maksimal Rp9.999.999.999,99, dan paling banyak dua angka desimal.';
}

var vendorApplicationSending=false;
async function submitVendorApplication(){
  if(vendorApplicationSending)return;
  var value=function(id){return document.getElementById(id).value.trim()};
  var message=document.getElementById('vreg-message'),button=document.getElementById('vreg-submit');
  var showMessage=function(text,error){message.textContent=text;message.style.display='block';message.style.background=error?'var(--bad)':'var(--ok)';message.style.color=error?'var(--badt)':'var(--okt)'};
  var basePrice=parseVendorBasePrice(value('vbp'));
  var data={brandName:value('vn'),ownerName:value('vo'),category:value('vk'),city:value('vcity'),email:value('ve'),whatsapp:value('vw'),basePrice:basePrice,instagram:value('vi'),portfolioUrl:value('vp'),description:value('vd')};
  if(!data.brandName||!data.ownerName||!data.category||!data.city||!data.email||!data.whatsapp){showMessage('Lengkapi semua data wajib pada Tahap 1.',true);return;}
  if(data.basePrice===null){showMessage('Harga dasar harus lebih dari Rp0, maksimal Rp9.999.999.999,99, dan paling banyak dua angka desimal.',true);return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){showMessage('Format email tidak valid.',true);return;}
  if(data.instagram&&!/^@[\w.]{1,30}$/.test(data.instagram)&&!validHttpUrl(data.instagram)){showMessage('Instagram harus berupa @username atau URL HTTP/HTTPS yang valid.',true);return;}
  if(data.portfolioUrl&&!validHttpUrl(data.portfolioUrl)){showMessage('URL portofolio harus menggunakan HTTP/HTTPS yang valid.',true);return;}
  vendorApplicationSending=true;button.disabled=true;button.textContent='Mengirim...';showMessage('Mengirim pengajuan ke server...',false);
  try{
    var result=await apiRequest('/api/vendor-applications','POST',data);
    if(!result.ok||!result.application||result.application.status!=='pending_approval')throw new Error('Server belum mengonfirmasi penyimpanan pengajuan.');
    showVendorApplicationSuccess(result.application.id);
    toast('Pengajuan vendor berhasil dikirim.');
  }catch(err){showMessage(err.message||'Pengajuan gagal disimpan. Silakan coba lagi.',true);toast('Pengajuan gagal: '+(err.message||'Kesalahan server.'));}
  finally{vendorApplicationSending=false;button.disabled=false;button.textContent='Kirim Pendaftaran';}
}

  // 1. Coba gunakan library resmi Midtrans Snap Popup
  if (window.snap && typeof window.snap.pay === 'function' && token) {
    try {
      window.snap.pay(token, {
        onSuccess: function(result) {
          toast('✅ Pembayaran berhasil!');
          closeSnapModalAndSync(bookingId);
        },
        onPending: function(result) {
          toast('⏳ Menunggu pembayaran selesai.');
          closeSnapModalAndSync(bookingId);
        },
        onError: function(result) {
          toast('❌ Pembayaran gagal.');
          closeSnapModalAndSync(bookingId);
        },
        onClose: function() {
          toast('Pop-up pembayaran ditutup.');
          closeSnapModalAndSync(bookingId);
        }
      });
      return;
    } catch(err) {
      console.warn('snap.pay fallback:', err);

  // 2. Fallback: Tampilkan In-Page Modal dengan iframe dan link alternatif
  var existingModal = document.getElementById('snap-inpage-modal');

  var modal = document.createElement('div');
  modal.id = 'snap-inpage-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.85);z-index:999999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);';

// Global Click Delegation
document.addEventListener('click',function(e){
  if(e.target.id==='admin-application-modal-backdrop'&&S.role==='admin'){S.adminApplicationDetail='';S.adminApplicationConfirmStatus='';render();return}
  if(e.target.id==='dispute-modal-backdrop'){closeDisputeModal();return}
  var a=e.target.closest('[data-a]');
  if(!a) return;
  var k=a.dataset.a,v=a.dataset.v;

  if(k==='refresh-vendor-dashboard'){
    if(S.role==='vendor') refreshVendorDashboard();
    else toast('Dashboard hanya tersedia untuk akun vendor.');
    return;
  }

  if(k==='refresh-admin-summary'){
    refreshAdminSummary();
    return;
  }

  if(k==='refresh-admin-applications'){
    refreshAdminApplications();
    return;
  }

  if(k==='view-admin-application'){
    if(S.role==='admin'&&(S.adminApplications||[]).some(function(app){return String(app.id)===String(v)})){S.adminApplicationDetail=v;S.adminApplicationConfirmStatus='';S.adminApplicationActionError='';S.adminApplicationActionSuccess='';render()}
    return;
  }

  if(k==='close-admin-application'){
    S.adminApplicationDetail='';S.adminApplicationConfirmStatus='';render();
    return;
  }

  if(k==='close-dispute-modal'){closeDisputeModal();return;}

  if(k==='request-admin-application-decision'){
    if(S.role==='admin'&&!S.adminApplicationActionLoading&&['approved','rejected'].includes(a.dataset.status)){S.adminApplicationDetail=v;S.adminApplicationConfirmStatus=a.dataset.status;S.adminApplicationActionError='';S.adminApplicationActionSuccess='';render()}
    return;
  }

  if(k==='cancel-admin-application-confirm'){
    if(!S.adminApplicationActionLoading){S.adminApplicationConfirmStatus='';render()}
    return;
  }

  if(k==='execute-admin-application-decision'){
    submitAdminApplicationDecision(v,a.dataset.status);
    return;
  }

  if(k==='select-vendor-booking'){
    selectVendorBooking(v);
    return;
  }

  if(k==='view-vendor-agreement'){
    openVendorAgreementModal(v);
    return;
  }

  if(k==='submit-vendor-arrival'){
    submitVendorArrival(v);
    return;
  }

  if(k==='confirm'){
    e.stopImmediatePropagation();
    apiRequest('/api/bookings/'+encodeURIComponent(S.activeBid)+'/complete','POST',{}).then(function(){return refreshBookings(S.activeBid)}).then(function(){toast('Penyelesaian booking tercatat.');render()}).catch(function(err){toast(err.message)});
    return;
  }
  if(k==='cancel-booking'){
    e.stopImmediatePropagation();
    (async function(){
      try{
        var estimateData=await apiRequest('/api/bookings/'+encodeURIComponent(S.activeBid)+'/refund-estimate');
        var estimate=estimateData.estimate;
        var confirmText='Aturan refund: '+estimate.description+'\n\nEstimasi dikembalikan: '+rp(estimate.refundAmount)+'\nTidak dikembalikan: '+rp(estimate.notRefundedAmount)+'\n\nBatalkan booking ini?';
        if(!window.confirm(confirmText)) return;
        await apiRequest('/api/bookings/'+encodeURIComponent(S.activeBid)+'/cancel','POST',{});
        await refreshBookings(S.activeBid);
        toast('Booking dibatalkan dan hasil refund tersimpan.');
        render();
      }catch(err){toast('Pembatalan gagal: '+err.message)}
    })();
    return;
  }
  if(k==='open-complain'){
    e.stopImmediatePropagation();openDisputeModal(S.activeBid);
    return;
  }

  if(k=='cat'){S.cat=v;render();}
  else if(k=='item'){S.vid=v;var picked=getVendor(S.vid);if(!picked){toast('Vendor tidak ditemukan. Muat ulang katalog.');return}S.item=picked.c=='Sign'?'s':'g';S.pkg=1;S.activeBid='';S.bookingId='';go('vendor');}
  else if(k=='selpkg'){S.pkg=+v;render();}
  else if(k=='search'){
    var mp={'PA Wisuda':'PA','Graduation Content Creator':'GCC','Hijab & Hair Stylist':'Stylist','MUA':'MUA','Acrylic Standing Sign':'Sign'},sv=document.getElementById('b'),dd=document.getElementById('d');
    S.cat=sv&&mp[sv.value]||'Semua';if(dd){S.cc=dd.value;S.city=dd.value}
  }
  else if(k=='payrest'){
    openFinalCheckout(S.activeBid);
  }
  else if(k=='paydp'){
    S.mode='dp';
    go('checkout');
  }
  else if(k=='vdone'){
    S.stage=2;
    toast('Acara ditandai selesai! Menunggu konfirmasi akhir.');
    render();
  }
  else if(k=='confirm'){
    S.stage=3;
    toast('✅ Konfirmasi diterima! Dana Rp105.000 berhasil dicairkan ke vendor.');
    render();
  }
  else if(k=='verify'){
    S.vf=document.getElementById('vf').value.trim();
    render();
  }
  else if(k=='out'){
    e.preventDefault();
    apiRequest('/api/auth/logout','POST',{}).then(function(){
      S.role=null;S.user='';S.bookingsList=[];S.activeBid='';S.bookingId='';
      toast('Berhasil keluar.');go('beranda');
    }).catch(function(err){toast('Gagal logout: '+err.message)});
  }
  else if(k=='paymidtrans'){
    var btn=document.getElementById('btn-midtrans');
    if(btn){btn.disabled=true;btn.textContent='Memproses pembayaran...';}
    (async function(){
      try{
        var bid=S.activeBid;
        var isFinal=S.mode==='lunas',active=null;
        if(isFinal){
          if(!bid||!S.finalCheckoutBooking||S.finalCheckoutBooking.id!==bid) throw new Error('Detail booking pelunasan belum dimuat. Buka kembali pelunasan dari Booking Saya.');
          active=await apiRequest('/api/bookings/'+encodeURIComponent(bid));
          if(active.id!==bid) throw new Error('Server mengembalikan booking yang berbeda.');
          if(active.state!=='DPPaid') throw new Error('Booking tidak lagi berstatus DP dibayar. Pembayaran diblokir.');
          S.finalCheckoutBooking=active;
        }else{
          active=S.bookingsList.find(function(b){return b.id===bid;});
        }
        if(!isFinal&&(!active||!['Pending','WaitingVendorApproval'].includes(active.state))){
          var front=getVendor(S.vid);
          if(!front) throw new Error('Vendor tidak tersedia. Muat ulang katalog dan pilih vendor lagi.');
          var futureDate=S.eventDate||new Date(Date.now()+14*86400000).toISOString().split('T')[0];
          var created=await apiRequest('/api/bookings','POST',{vendorId:front.id,packageId:String(S.pkg),date:futureDate,location:S.cc||S.city||'Malang',startTime:'08:00',agreed:true});
          bid=created.id;S.activeBid=bid;S.bookingId=bid;
          await refreshBookings(bid);
        }
        if(!bid) throw new Error('Pilih booking untuk melakukan pembayaran.');
        if(!isFinal) active=S.bookingsList.find(function(b){return b.id===bid;});
        if(!active) throw new Error('Booking tidak berhasil dimuat. Pembayaran diblokir.');
        var expectedState=active&&active.state;
        var payment=await apiRequest('/api/bookings/'+encodeURIComponent(bid)+'/payment','POST',{method:'QRIS',outcome:'success',expectedState:expectedState,paymentType:isFinal?'FINAL':'DP',confirmedFinal:isFinal});
        if(btn){btn.disabled=false;btn.textContent='Bayar';}
        await refreshBookings(bid);
        if(payment.token||payment.redirect_url){
          toast('Membuka gateway pembayaran...');
          openSnapModal(payment.token,payment.redirect_url,bid);
        }else if(payment.state){
          S.mode='dp';go('status');toast('Status pembayaran diperbarui dari server: '+payment.state+'.');
        }else{
          throw new Error('Server tidak memberikan status pembayaran.');
        }
      }catch(err){
        if(btn){btn.disabled=false;btn.textContent='Bayar';}
        toast('Pembayaran gagal diproses: '+err.message);
      }
    })();
  }
});

document.addEventListener('input', function(e){
  if(e.target&&e.target.id==='dispute-title')S.disputeForm.title=e.target.value;
  if(e.target&&e.target.id==='dispute-evidence')S.disputeForm.evidence=e.target.value;
  if(e.target&&e.target.id==='dispute-evidence-url')S.disputeForm.evidenceUrl=e.target.value;
  if(e.target && e.target.id === 'vendor-otp-input'){
    S.vendorOtpInput = e.target.value.replace(/\D/g, '').slice(0, 6);
    if(e.target.value !== S.vendorOtpInput) e.target.value = S.vendorOtpInput;
  }
});

document.addEventListener('keydown', function(e){
  if(S.disputeModalBookingId){
    if(e.key==='Escape'){e.preventDefault();closeDisputeModal();return;}
    if(e.key==='Tab'){
      var dialog=document.querySelector('.dispute-modal'),focusable=dialog?Array.prototype.slice.call(dialog.querySelectorAll('button:not([disabled]),textarea:not([disabled]),input:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')):[];
      if(focusable.length){var first=focusable[0],last=focusable[focusable.length-1];if(!dialog.contains(document.activeElement)){e.preventDefault();first.focus()}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    }
  }
  if(e.target && e.target.id === 'vendor-otp-input' && e.key === 'Enter'){
    e.preventDefault();
    submitVendorArrival(S.activeVendorBid);
  }
});

document.addEventListener('submit',function(e){
  if(e.target&&e.target.id==='dispute-form'){e.preventDefault();submitBookingDispute();}
});

initializeLockIn();
</script>
</body>
</html>
