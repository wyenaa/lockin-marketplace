verifikasi:function(){var st=S.stage,ch=st==3?'Released':st==4?'Resolved':st==2?'Completed':'DPPaid',ok=S.vf.toUpperCase()=='LK-2611'&&st>0;return '<div class="w sec" style="max-width:560px"><div class="card pad"><h2>Verifikasi Booking</h2><p class="mut">Masukkan kode booking untuk melihat bukti di blockchain (testnet). Tidak perlu login.</p><label for="vf">Kode booking</label><input type="text" id="vf" value="'+(S.vf||'LK-2611')+'"><p><button class="btn" data-a="verify">Cek</button></p>'+(S.vf?(ok?'<div class="row"><span>Hash perjanjian</span><b>0x7a3f&hellip;c91e</b></div><div class="row"><span>Status tercatat</span><b>'+ch+'</b></div><div class="row"><span>Transaksi</span><b>0x91b2&hellip;04ad</b></div><p class="mut">Hanya hash dan status yang dicatat, tanpa data pribadi.</p>':'<div class="msg" style="background:var(--bad);color:var(--badt)">Kode tidak ditemukan atau belum ada transaksi.</div>'):'')+'</div></div>'},
cara:function(){var st=[['Pilih vendor dan paket','Lihat harga, lingkup kerja, dan aturan refund sebelum memesan.'],['Setujui perjanjian','Kedua pihak menyetujui isi perjanjian. Isinya terkatat dan tidak bisa diubah sepihak.'],['Bayar lewat QRIS, VA, atau e-wallet','Dana ditahan dan belum menjadi hak vendor sampai syarat terpenuhi.'],['Acara selesai, dana cair','Vendor menandai selesai, pelanggan konfirmasi, lalu dana dicairkan. Tanpa konfirmasi dalam 48 jam, dana otomatis cair.'],['Ada masalah? Ajukan keluhan','Pencairan ditahan dan admin memutuskan berdasarkan perjanjian dan bukti.']];return '<div class="w sec"><h1 style="font-size:clamp(30px,4vw,44px)">Cara Kerja LockIn</h1><p class="mut" style="max-width:560px;font-size:16px">Pembayaranmu dijaga dari awal sampai acara selesai.</p><div class="stp">'+st.map(function(s,i){return '<div><i>'+(i+1)+'</i><span><b>'+s[0]+'</b><span class="mut">'+s[1]+'</span></span></div>'}).join('')+'</div><div class="grid" style="margin-top:28px"><div class="card pad"><h2>Untuk pelanggan</h2><p class="mut">DP aman, aturan refund jelas sebelum bayar, dan bukti yang bisa dicek.</p><a class="btn" href="#daftar">Cari Vendor</a></div><div class="card pad"><h2>Untuk vendor</h2><p class="mut">Jadwal terkunci setelah DP dan pembayaran pasti.</p><a class="btn o" href="#daftar-vendor">Daftar jadi vendor</a></div><div class="card pad"><h2>Cek bukti booking</h2><p class="mut">Siapa saja bisa mengecek status dengan kode booking.</p><a class="btn o" href="#verifikasi">Cek booking</a></div></div></div>'},
'daftar-vendor':function(){return '<div class="w sec" style="max-width:560px"><div class="card pad"><h2>Daftar jadi vendor</h2><p class="mut">Isi data singkat. Tim LockIn akan menghubungi dan memverifikasi usahamu sebelum tampil di katalog.</p><label for="vn">Nama usaha</label><input type="text" id="vn"><label for="vk" style="margin-top:12px">Jenis jasa</label><select id="vk"><option>PA Wisuda</option><option>Graduation Content Creator</option><option>Hijab &amp; Hair Stylist</option><option>MUA</option><option>Sewa Acrylic Standing Sign</option></select><label for="vw" style="margin-top:12px">Nomor WhatsApp</label><input type="text" id="vw"><p><button class="btn blk" data-a="vreg">Kirim pendaftaran</button></p><p class="mut">Sudah punya akun? <a href="#masuk-vendor" style="color:var(--p);font-weight:700">Masuk</a></p></div></div>'}
};
var AC={status:'customer',checkout:'customer',dashboard:'vendor',admin:'admin'},LG={customer:'masuk',vendor:'masuk-vendor',admin:'masuk-admin'},HM={customer:'beranda',vendor:'dashboard',admin:'admin'};
function lf(r,t,h){return '<div class="w sec" style="max-width:480px"><div class="card pad"><h2>'+t+'</h2><p class="mut">Akun dibuat dan diverifikasi oleh tim LockIn.</p><label for="u">Username</label><input type="text" id="u" autocomplete="username"><label for="p" style="margin-top:12px">Password</label><input type="password" id="p" autocomplete="current-password" style="width:100%;border:1px solid var(--b);border-radius:12px;padding:12px;background:var(--c);color:var(--t)"><p><button class="btn blk" data-a="login" data-v="'+r+'">Masuk</button></p><p class="mut">Akun demo: '+h+' / demo123</p>'+(r=='vendor'?'<p class="mut">Belum punya akun? <a href="#daftar-vendor" style="color:var(--p);font-weight:700">Daftar jadi vendor</a></p>':'')+'</div></div>'}
function stp(n){var L=['Perjanjian','Pembayaran','Status'];return '<div class="stepper">'+L.map(function(t,i){return '<span class="'+(i+1==n?'on':i+1<n?'dn':'')+'"><i>'+(i+1<n?'&#10003;':i+1)+'</i>'+t+'</span>'+(i<2?'<em></em>':'')}).join('')+'</div>'}
function nav(){var r=S.role,l='',a='';if(!r||r=='customer')l='<a href="#beranda">Beranda</a><a href="#daftar">Cari Vendor</a><a href="#cara">Cara Kerja</a>'+(r?'<a href="#status">Booking Saya</a>':'');else l=r=='vendor'?'<a href="#dashboard">Dashboard'+(S.req&&S.req.status=='pending'?' <span class="tag bad">1</span>':'')+'</a>':'<a href="#admin">Panel Admin</a>';if(r)a='<details class="mn"><summary aria-label="Menu akun"><span class="av">'+S.user.charAt(0).toUpperCase()+'</span><span>'+S.user+'</span></summary><div class="dd">'+(r=='customer'?'<a href="#status">Booking Saya</a>':r=='vendor'?'<a href="#dashboard">Dashboard</a>':'<a href="#admin">Panel Admin</a>')+'<a href="#beranda" data-a="out">Keluar</a></div></details>';else a='<a class="btn" href="#masuk">Masuk</a>';document.getElementById('nv').innerHTML=l;document.getElementById('ac').innerHTML=a;var cur='#'+(location.hash||'#beranda').slice(1);[].forEach.call(document.querySelectorAll('#nv a'),function(x){x.classList.toggle('on',x.getAttribute('href')==cur)})}
function render(){var r=(location.hash||'#beranda').slice(1);if(!pages[r])r='beranda';var need=AC[r];if(need&&S.role!=need){if(S.role){toast('Halaman ini khusus '+need);location.hash='#'+HM[S.role];return}S.next=r;toast('Silakan masuk dulu');location.hash='#'+LG[need];return}nav();document.getElementById('app').innerHTML=pages[r]();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);
document.addEventListener('change',function(e){var t=e.target.id;if(t=='agr')S.agree=e.target.checked;if(t=='scn')S.sc=e.target.value;if(t=='cty'){S.city=e.target.value;if(S.city!='Semua kota')S.cc=S.city;render()}if(t=='loc'){S.cc=e.target.value;render()}});
function go(n){location.hash='#'+n;render()}
document.addEventListener('click',function(e){var a=e.target.closest('[data-a]');if(!a)return;var k=a.dataset.a,v=a.dataset.v;
if(k=='cat'){S.cat=v;render()}
else if(k=='item'){S.vid=+v;S.item=VD[S.vid].c=='Sign'?'s':'g'}
else if(k=='pay'){S.pay=v;render()}
else if(k=='dec'){S.dec=v;render()}
else if(k=='tocheck'){if(!S.agree){toast('Centang persetujuan perjanjian dulu');return}S.mode='dp';if(S.role!='customer'){S.next='checkout';toast('Masuk dulu sebagai pelanggan');go('masuk');return}go('checkout')}
else if(k=='req'){if(S.role!='customer'){S.next='vendor';toast('Masuk dulu sebagai pelanggan');go('masuk');return}S.req={vid:S.vid,city:S.cc,status:'pending',tr:0};toast('Permintaan dikirim ke vendor');go('status')}
else if(k=='vapp'){S.req.tr=+document.getElementById('trs').value;S.req.status='approved';render();toast('Permintaan disetujui. Pelanggan bisa lanjut ke perjanjian dan DP')}
else if(k=='vrej'){S.req.status='rejected';render();toast('Permintaan ditolak')}
else if(k=='payrest'){S.mode='lunas';go('checkout')}
else if(k=='paynow'){if(S.mode=='lunas'){if(S.sc=='sukses'){S.lunas=true;toast('Pelunasan berhasil')}else if(S.sc=='gagal')toast('Pembayaran gagal. Coba lagi sebelum H-7');else S.stage=-3;S.mode='dp'}else{S.stage=S.sc=='sukses'?1:S.sc=='gagal'?-1:-2;S.dispute=false;S.lunas=(S.item=='s'&&S.stage==1)}go('status')}
else if(k=='google'){S.role='customer';S.user='Rani';var n=S.next||'beranda';S.next=null;go(n)}
else if(k=='login'){var u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(!((v=='vendor'&&u=='vendor_demo'||v=='admin'&&u=='admin_demo')&&p=='demo123')){toast('Username atau password salah');return}S.role=v;S.user=v=='vendor'?'Glow Studio':'Admin';var m=S.next&&AC[S.next]==v?S.next:HM[v];S.next=null;go(m)}
else if(k=='out'){S.role=null;S.user='';S.next=null;go('beranda')}
else if(k=='search'){var mp={'PA Wisuda':'PA','Graduation Content Creator':'GCC','Hijab & Hair Stylist':'Stylist','MUA':'MUA','Acrylic Standing Sign':'Sign'},sv=document.getElementById('b'),dd=document.getElementById('d');S.cat=sv&&mp[sv.value]||'Semua';if(dd){S.cc=dd.value;S.city=dd.value}}
else if(k=='vreg'){if(!document.getElementById('vn').value.trim()||!document.getElementById('vw').value.trim()){toast('Isi nama usaha dan nomor WhatsApp');return}toast('Pendaftaran terkirim. Tim kami akan menghubungi lewat WhatsApp');go('beranda')}
else if(k=='vdone'){S.stage=2;render();toast('Ditandai selesai. Menunggu konfirmasi pelanggan')}
else if(k=='confirm'){S.stage=3;render();toast('Dana dicairkan ke vendor')}
else if(k=='complain'){S.dispute=true;render();toast('Keluhan diajukan ke admin')}
else if(k=='savedec'){S.stage=4;render();toast('Keputusan tersimpan dan status diperbarui')}
else if(k=='verify'){S.vf=document.getElementById('vf').value.trim();render()}
});
render();
</script>
