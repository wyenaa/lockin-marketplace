function calc(){

  var pkgs=getPackages(v);
  var curPkg=pkgs.find(function(x){return x.id==S.pkg})||pkgs[0];
  var price=sg?v.a:curPkg.price;
  var dep=sg?100000:0;
  var due=dep?(price+dep):Math.round(price*0.3);
  var fee=Math.round(price*0.03);
  var tr=(S.req&&S.req.status=='approved'&&S.req.vid==v.i)?S.req.tr:0;
  var rest=dep?0:(price-due);
  var tot=due+fee+tr;
  return {
    i:{n:v.n,p:price,dep:dep,pkgName:curPkg.name},
    fee:fee,due:due,tr:tr,rest:rest,total:tot,full:tot+rest
  };
}

// Universal Login 1 Pintu
async function handleUniversalLogin(e){
  e.preventDefault();
  var em=document.getElementById('login-email').value.trim().toLowerCase();
  var pw=document.getElementById('login-pass').value;
  var btn=document.getElementById('btn-login-submit');
  if(btn){ btn.disabled=true; btn.textContent='Memverifikasi...'; }

  try{
    var res=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:em,password:pw})
    });
    var data=await res.json().catch(function(){return {};});
    if(res.ok && data && data.user){
      var u=data.user;
      S.role=u.role;
      S.user=u.name;
      toast('✅ Berhasil masuk sebagai '+u.name);
      if(btn){ btn.disabled=false; btn.textContent='Masuk ke Akun'; }
      if(u.role==='vendor') go('dashboard');
      else if(u.role==='admin') go('admin');
      else go('beranda');
    }else{
      if(btn){ btn.disabled=false; btn.textContent='Masuk ke Akun'; }
      var msg=(data&&data.error)||'Email atau kata sandi tidak cocok.';
      toast('❌ '+msg);
      alert('Gagal Masuk:\n'+msg+'\n\nSilakan periksa kembali email dan kata sandi Anda.');
    }
  }catch(err){
    if(btn){ btn.disabled=false; btn.textContent='Masuk ke Akun'; }
    toast('Terjadi kendala koneksi ke server.');
  }
}

function quickLogin(email,role,name){
  S.role=role;

  toast('Berhasil masuk sebagai '+name+' ('+role+')');
  if(role==='vendor') go('dashboard');
  else if(role==='admin') go('admin');
  else go('beranda');
}

      window.snap.pay(token, {
        onSuccess: function(result) {
          toast('✅ Pembayaran berhasil!');
          closeSnapModalAndSync(bookingId);
        },
        onPending: function(result) {
          toast('⏳ Menunggu pembayaran selesai.');
          closeSnapModalAndSync(bookingId);
        },
        onError: function(result) {
          toast('❌ Pembayaran gagal.');
        },
        onClose: function() {
          toast('Pop-up pembayaran ditutup.');
        }
      });
      return;

  // 2. Fallback: Tampilkan In-Page Modal dengan iframe dan link alternatif
  var existingModal = document.getElementById('snap-inpage-modal');

  modal.id = 'snap-inpage-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.85);z-index:999999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);';

// Global Click Delegation
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-a]');
  if(!a) return;
  var k=a.dataset.a,v=a.dataset.v;

  if(k=='cat'){S.cat=v;render();}
  else if(k=='item'){S.vid=+v;S.item=VD[S.vid].c=='Sign'?'s':'g';S.pkg=1;go('vendor');}
  else if(k=='selpkg'){S.pkg=+v;render();}
  else if(k=='search'){
    var mp={'PA Wisuda':'PA','Graduation Content Creator':'GCC','Hijab & Hair Stylist':'Stylist','MUA':'MUA','Acrylic Standing Sign':'Sign'},sv=document.getElementById('b'),dd=document.getElementById('d');
    S.cat=sv&&mp[sv.value]||'Semua';if(dd){S.cc=dd.value;S.city=dd.value}
  }
  else if(k=='payrest'){
    S.mode='lunas';
    go('checkout');
  }
  else if(k=='vdone'){
    S.stage=2;
    toast('Acara ditandai selesai! Menunggu konfirmasi akhir.');
    render();
  }
  else if(k=='confirm'){
    S.stage=3;
    toast('✅ Konfirmasi diterima! Dana Rp105.000 berhasil dicairkan ke vendor.');
    render();
  }
  else if(k=='open-complain'){
    var r=prompt('Masukkan kronologi keluhan sengketa:');
    if(r){
      S.dispute=true;
      toast('⚠️ Keluhan diajukan. Pencairan dana ditahan sampai admin memutuskan.');
      render();
    }
  }
  else if(k=='verify'){
    S.vf=document.getElementById('vf').value.trim();
    render();
  }
  else if(k=='out'){
    S.role=null;S.user='';go('beranda');
  }
  else if(k=='paymidtrans'){
    var btn=document.getElementById('btn-midtrans');
    if(btn){btn.disabled=true;btn.textContent='Menghubungkan Midtrans...';}
    toast('Membuka gateway pembayaran Midtrans...');

    (async function(){
      try{
        // 1. Pastikan selalu terautentikasi di backend
        await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'user@lockin.demo', password: 'demo123' })
        }).catch(function(){});

        var bid = S.activeBid || S.bookingId;
        var vendorId = (S.vid != null ? Number(S.vid) : 0) + 1;
        if(vendorId > 6 || vendorId < 1) vendorId = 1;
        var futureDate = S.eventDate || new Date(Date.now() + 14 * 86400000).toISOString().split('T')[0];

        // 2. Jika mode DP, buatkan booking baru di backend jika belum dibuat
        if(S.mode === 'dp') {
          var bRes = await fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              vendorId: vendorId,
              date: futureDate,
              location: S.cc || S.city || 'Malang',
              startTime: '08:00',
              agreed: true
            })
          }).catch(function(){return null;});

          if(bRes && bRes.ok) {
            var bData = await bRes.json().catch(function(){return {};});
            if(bData && bData.id) {
              bid = bData.id;
              S.bookingId = bid;
              S.activeBid = bid;
              var c = calc();
              if(!S.bookingsList.find(function(x){return x.id === bid})) {
                S.bookingsList.unshift({
                  id: bid,
                  vid: S.vid,
                  pkg: S.pkg,
                  date: futureDate,
                  price: c.i.p,
                  dpPaid: c.total,
                  rest: c.rest,
                  state: 'DPPaid',
                  arrived: false,
                  otp: bData.arrival_code || '482910'
                });
              }
            }
          }
        }

        if(!bid) bid = 'LK-2611';

        // 3. Minta token pembayaran Snap dari backend
        var pRes = await fetch('/api/bookings/' + bid + '/payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ method: 'QRIS', outcome: 'success' })
        }).catch(function(){return null;});

        var pData = pRes ? await pRes.json().catch(function(){return {};}) : {};
        if(btn){btn.disabled=false;btn.textContent='Bayar';}

        if(pData && (pData.token || pData.redirect_url)){
          toast('Membuka pop-up pembayaran...');
          openSnapModal(pData.token, pData.redirect_url, bid);
        } else {
          var errMsg = pData.error || 'Gagal membuat sesi pembayaran Midtrans.';
          toast('⚠️ ' + errMsg);
          alert('Kendala Pembayaran:\n' + errMsg + '\n\nSilakan coba beberapa saat lagi.');
        }
      }catch(err){
        if(btn){btn.disabled=false;btn.textContent='Bayar';}
        toast('Gagal memproses pembayaran: ' + err.message);
      }
    })();
  }
});

render();
</script>
</body>
</html>
