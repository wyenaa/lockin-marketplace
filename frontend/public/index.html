function openSnapModal(token, redirectUrl, bookingId) {

        fetch('/api/bookings/' + bookingId + '/sync-payment', { method: 'POST' }).finally(function() {
          S.stage = 1;

    modal.id = 'snap-inpage-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.75);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px);';
    modal.innerHTML = '<div style="position:relative;width:100%;max-width:440px;height:650px;max-height:92vh;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,0.35);display:flex;flex-direction:column;"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #e2e8f0;background:#f8fafc"><div style="display:flex;align-items:center;gap:8px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#10B981"></span><b style="font-size:14px;color:#1e293b">Midtrans Sandbox Payment</b></div><button onclick="document.getElementById(\'snap-inpage-modal\').remove();go(\'status\')" style="background:none;border:none;font-size:26px;cursor:pointer;color:#64748b;line-height:1;padding:0 4px">&times;</button></div><iframe src="' + (redirectUrl || ('https://app.sandbox.midtrans.com/snap/v4/redirection/' + token)) + '" style="flex:1;border:none;width:100%;height:100%"></iframe></div>';
    document.body.appendChild(modal);
  }
}

function nav(){
  var r=S.role,l='',a='';
  if(!r||r=='customer')l='<a href="#beranda">Beranda</a><a href="#daftar">Cari Vendor</a><a href="#cara">Cara Kerja</a>'+(r?'<a href="#status">Booking Saya</a>':'');
  else l=r=='vendor'?'<a href="#dashboard">Dashboard Vendor'+(S.req&&S.req.status=='pending'?' <span class="tag bad">1</span>':'')+'</a><a href="#cara">Cara Kerja</a>':'<a href="#admin">Panel Admin</a><a href="#cara">Cara Kerja</a>';
  if(r)a='<details class="mn"><summary aria-label="Menu akun"><span class="av">'+S.user.charAt(0).toUpperCase()+'</span><span>'+S.user+'</span></summary><div class="dd">'+(r=='customer'?'<a href="#status">Booking Saya</a>':r=='vendor'?'<a href="#dashboard">Dashboard</a>':'<a href="#admin">Panel Admin</a>')+'<a href="#beranda" data-a="out">Keluar</a></div></details>';
  else a='<a class="btn" href="#masuk">Masuk</a>';
  document.getElementById('nv').innerHTML=l;
  document.getElementById('ac').innerHTML=a;
  var cur='#'+(location.hash||'#beranda').slice(1);
  [].forEach.call(document.querySelectorAll('#nv a'),function(x){x.classList.toggle('on',x.getAttribute('href')==cur)});
}

function render(){
  var r=(location.hash||'#beranda').slice(1);
  if(!pages[r])r='beranda';
  var need=AC[r];
  if(need&&S.role!=need){
    if(S.role){toast('Halaman ini khusus '+need);location.hash='#'+HM[S.role];return}
    S.next=r;toast('Silakan masuk terlebih dahulu');location.hash='#'+LG[need];return;
  }
  nav();
  document.getElementById('app').innerHTML=pages[r]();
  window.scrollTo(0,0);
}

window.addEventListener('hashchange',render);
document.addEventListener('change',function(e){
  var t=e.target.id;
  if(t=='agr')S.agree=e.target.checked;
  if(t=='scn')S.sc=e.target.value;
  if(t=='cty'){S.city=e.target.value;if(S.city!='Semua kota')S.cc=S.city;render()}
  if(t=='loc'){S.cc=e.target.value;render()}
});

function go(n){location.hash='#'+n;render()}

document.addEventListener('click',function(e){
  var a=e.target.closest('[data-a]');
  if(!a)return;
  var k=a.dataset.a,v=a.dataset.v;
  if(k=='cat'){S.cat=v;render()}
  else if(k=='item'){S.vid=+v;S.item=VD[S.vid].c=='Sign'?'s':'g';S.pkg=1}
  else if(k=='selpkg'){S.pkg=+v;render()}
  else if(k=='pay'){S.pay=v;render()}
  else if(k=='dec'){S.dec=v;render()}
  else if(k=='tocheck'){
    if(!S.agree){toast('Harap centang persetujuan perjanjian dulu');return}
    S.mode='dp';
    if(S.role!='customer'){S.next='checkout';toast('Masuk dulu sebagai pelanggan');go('masuk');return}
    go('checkout');
  }
  else if(k=='req'){
    if(S.role!='customer'){S.next='vendor';toast('Masuk dulu sebagai pelanggan');go('masuk');return}
    S.req={vid:S.vid,city:S.cc,status:'pending',tr:0};toast('Permintaan dikirim ke vendor');go('status');
  }
  else if(k=='vapp'){S.req.tr=+document.getElementById('trs').value;S.req.status='approved';render();toast('Permintaan disetujui');}
  else if(k=='vrej'){S.req.status='rejected';render();toast('Permintaan ditolak');}
  else if(k=='payrest'){S.mode='lunas';go('checkout')}
  else if(k=='paymidtrans'){
    var btn = e.target.closest('button');
    if(btn) { btn.disabled = true; btn.innerText = 'Menghubungkan Midtrans...'; }
    toast('Menghubungkan ke Midtrans Snap Sandbox...');

    (async function(){
      try {
        // 1. Pastikan user terautentikasi di backend
        await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'user@lockin.demo', password: 'LockInDemo123!' })
        }).catch(function(){});

        var vendorId = (S.vid != null ? Number(S.vid) : 0) + 1;
        if(vendorId > 6 || vendorId < 1) vendorId = 1;
        var futureDate = new Date(Date.now() + 14 * 86400000).toISOString().split('T')[0];

        // 2. Buat atau perbarui booking di backend
        var bookingId = S.bookingId;
        if(!bookingId || S.mode === 'dp') {
          var bRes = await fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              vendorId: vendorId,
              date: futureDate,
              location: S.loc || 'Malang',
              startTime: '08:00',
              agreed: true
            })
          });
          var bData = await bRes.json();
          if(bData.id) {
            bookingId = bData.id;
            S.bookingId = bookingId;
          }
        }

        if(!bookingId) bookingId = 'LK-2611';

        // 3. Panggil API pembayaran Snap
        var pRes = await fetch('/api/bookings/' + bookingId + '/payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method: S.pay || 'QRIS',
            outcome: 'success'
          })
        });

        var pData = await pRes.json();
        if(btn) { btn.disabled = false; btn.innerText = '💳 Bayar via Midtrans Sandbox (Snap Gateway)'; }

        if(pData.redirect_url || pData.token) {
          S.midtransUrl = pData.redirect_url;
          S.stage = 1;
          S.dispute = false;
          toast('Membuka pop-up pembayaran Midtrans...');
          openSnapModal(pData.token, pData.redirect_url, bookingId);
        } else {
          toast('Gagal membuka Midtrans: ' + (pData.error || 'Server error'));
        }
      } catch(err) {
        if(btn) { btn.disabled = false; btn.innerText = '💳 Bayar via Midtrans Sandbox (Snap Gateway)'; }
        toast('Koneksi Midtrans gagal: ' + err.message);
      }
    })();
  }
  else if(k=='syncpay'){
    var btn = e.target.closest('button');
    if(btn) { btn.disabled = true; btn.innerText = 'Memeriksa Midtrans...'; }
    toast('Memeriksa status pembayaran dari Midtrans Sandbox...');
    (async function(){
      try {
        var bid = S.bookingId || 'LK-2611';
        var res = await fetch('/api/bookings/' + bid + '/sync-payment', { method: 'POST' });
        var data = await res.json();
        if(btn) { btn.disabled = false; btn.innerText = '🔄 Sinkronkan Status Pembayaran'; }
        if(data.result && data.result.paymentStatus === 'PAID') {
          S.stage = 1;
          if(S.mode === 'lunas') S.lunas = true;
          toast('Pembayaran Midtrans Sukses! Tercatat di Escrow & Sepolia.');
          render();
        } else if(data.result && data.result.paymentStatus === 'PENDING') {
          toast('Status Midtrans: Menunggu pembayaran di simulator.');
        } else if(data.booking && ['DPPaid', 'Paid'].includes(data.booking.state)) {
          S.stage = 1;
          if(data.booking.state === 'Paid') S.lunas = true;
          toast('Pembayaran terkonfirmasi: ' + data.booking.state);
          render();
        } else {
          toast(data.error || 'Status: Belum ada pembayaran sukses yang diterima.');
        }
      } catch(err) {
        if(btn) { btn.disabled = false; btn.innerText = '🔄 Sinkronkan Status Pembayaran'; }
        toast('Gagal sinkronisasi: ' + err.message);
      }
    })();
  }
  else if(k=='paynow'){
    if(S.mode=='lunas'){
      if(S.sc=='sukses'){S.lunas=true;toast('Pelunasan berhasil dikonfirmasi')}
      else if(S.sc=='gagal')toast('Pembayaran gagal. Silakan coba lagi.');
      else S.stage=-3;
      S.mode='dp';
    }else{
      S.stage=S.sc=='sukses'?1:S.sc=='gagal'?-1:-2;
      S.dispute=false;
      S.lunas=(S.item=='s'&&S.stage==1);
    }
    go('status');
  }
  else if(k=='google'){S.role='customer';S.user='Rani';var n=S.next||'beranda';S.next=null;go(n)}
  else if(k=='login'){
    var u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
    if(!((v=='vendor'&&u=='vendor_demo'||v=='admin'&&u=='admin_demo')&&p=='demo123')){toast('Username atau password salah');return}
    S.role=v;S.user=v=='vendor'?'Glow Studio':'Admin LockIn';
    var m=S.next&&AC[S.next]==v?S.next:HM[v];S.next=null;go(m);
  }
  else if(k=='out'){S.role=null;S.user='';S.next=null;go('beranda')}
  else if(k=='search'){
    var mp={'PA Wisuda':'PA','Graduation Content Creator':'GCC','Hijab & Hair Stylist':'Stylist','MUA':'MUA','Acrylic Standing Sign':'Sign'},sv=document.getElementById('b'),dd=document.getElementById('d');
    S.cat=sv&&mp[sv.value]||'Semua';if(dd){S.cc=dd.value;S.city=dd.value}
  }
  else if(k=='vreg'){
    if(!document.getElementById('vn').value.trim()||!document.getElementById('vw').value.trim()){toast('Isi nama usaha dan nomor WhatsApp');return}
    toast('Pendaftaran terkirim! Tim kurasi kami akan menghubungi via WhatsApp');go('beranda');
  }
  else if(k=='vdone'){S.stage=2;render();toast('Acara ditandai selesai! Menunggu konfirmasi pelanggan')}
  else if(k=='confirm'){S.stage=3;render();toast('Konfirmasi diterima! Dana berhasil dicairkan ke vendor')}
  else if(k=='complain'){S.dispute=true;render();toast('Keluhan diajukan! Dana ditahan sementara')}
  else if(k=='savedec'){S.stage=4;render();toast('Keputusan mediasi admin tersimpan on-chain')}
  else if(k=='verify'){S.vf=document.getElementById('vf').value.trim();render()}
});

render();
</script>
</body>
</html>
